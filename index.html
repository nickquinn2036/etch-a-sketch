<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>

    <div id="etch-a-sketch-frame">
        
        <h1 id="toy-title">MAGIC ETCH A SKETCH SCREEN</h1>
        
        <div id="container"></div>
    </div>

    <div id="control-panel">
        <button id="resize-btn">New Grid Size</button>
        <button id="black-btn" class="active">Black Ink</button>
        <button id="rainbow-btn">Rainbow Mode</button>
        <button id="shading-btn">Shading Mode</button>
        <button id="hover-draw-btn" class="active">Hover Trail</button>
        <button id="click-draw-btn">Click & Drag</button>
        <button id="clear-btn">Clear</button>
    </div>

<div id="secret-menu" class="hidden">
